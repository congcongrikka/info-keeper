name: "🐛 Bug 报告"
description: "报告一个可复现的问题（安全漏洞请勿在此提交）"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索一下已有 Issue。

        - **安全漏洞不要公开提**，请走 [SECURITY.md](../../SECURITY.md) 里的私有报告渠道。
        - 粘贴日志、截图前请先删掉真实邮箱、密钥、域名和用户数据。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 例如 v1.7.0，或具体的 commit hash
      placeholder: v1.7.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 登录 / 邀请码注册
        - 记录 / 检索 / 关联
        - AI 理解 / 问答
        - 待办 / 阶段总结
        - 每日早报（Web Push / 邮件）
        - PWA / iOS
        - 部署 / 环境变量
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: "1. … 2. … 3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / 报错原文
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 浏览器 / 系统 / Node 版本 / 部署平台。**不要填任何密钥值**
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue
          required: true
        - label: 我贴出的内容不含真实密钥、真实邮箱或用户数据
          required: true
